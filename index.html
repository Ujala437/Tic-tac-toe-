<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container">

        <!-- Game Title -->
        <h1>❌ Tic Tac Toe ⭕</h1>

        <p class="subtitle">
            Two Player Game
        </p>

        <!-- Players -->
        <div class="players">

            <!-- Player X -->
            <div class="player active" id="playerX">

                <h2 id="nameX">
                    Player X
                </h2>

                <p>
                    Symbol: ❌
                </p>

                <p>
                    Score:
                    <span id="scoreX">0</span>
                </p>

            </div>


            <!-- Player O -->
            <div class="player" id="playerO">

                <h2 id="nameO">
                    Player O
                </h2>

                <p>
                    Symbol: ⭕
                </p>

                <p>
                    Score:
                    <span id="scoreO">0</span>
                </p>

            </div>

        </div>


        <!-- Turn Message -->
        <div id="message">

            Player X ki turn hai ❌

        </div>


        <!-- Game Board -->
        <div class="board">

            <button class="cell"
                    data-index="0">
            </button>

            <button class="cell"
                    data-index="1">
            </button>

            <button class="cell"
                    data-index="2">
            </button>


            <button class="cell"
                    data-index="3">
            </button>

            <button class="cell"
                    data-index="4">
            </button>

            <button class="cell"
                    data-index="5">
            </button>


            <button class="cell"
                    data-index="6">
            </button>

            <button class="cell"
                    data-index="7">
            </button>

            <button class="cell"
                    data-index="8">
            </button>

        </div>


        <!-- Game Buttons -->
        <div class="buttons">

            <!-- Next Round -->
            <button id="nextRound"
                    onclick="nextRound()">

                🔄 Next Round

            </button>


            <!-- Reset Game -->
            <button id="reset"
                    onclick="resetGame()">

                🗑️ Reset Game

            </button>

        </div>

    </div>


    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>

</html>
